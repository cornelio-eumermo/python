{% if tarefas|length == 0 %}
    <div class="col-12">
        <p class="text-secondary text-center py-5">Nenhuma tarefa encontrada.</p>
    </div>
{% endif %}

{% for tarefa in tarefas %}
    <div class="col-12 col-md-6 col-lg-4">
        <div class="card card-tarefa status-{{ tarefa['status'] | replace(' ', '-') }} h-100 shadow-sm">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-start">
                    <h5 class="card-title">{{ tarefa['titulo'] }}</h5>
                    <span class="badge rounded-pill badge-status">{{ tarefa['status'] }}</span>
                </div>
                <p class="card-text">{{ tarefa['descricao'] or "Sem descrição." }}</p>
                <div class="d-flex gap-2">
                    <a href="{{ url_for('editar_tarefa', tarefa_id=tarefa['id']) }}" class="btn btn-sm btn-outline-primary">
                        <i class="bi bi-pencil-square"></i> Editar
                    </a>
                    <form method="POST" action="{{ url_for('excluir_tarefa', tarefa_id=tarefa['id']) }}">
                        <button type="submit" class="btn btn-sm btn-outline-danger">
                            <i class="bi bi-trash"></i> Excluir
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endfor %}
