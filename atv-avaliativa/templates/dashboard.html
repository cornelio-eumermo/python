{% extends "base.html" %}
{% block title %}Minhas tarefas{% endblock %}

{% block content %}
<div class="alert alert-info d-flex align-items-center gap-2">
    <i class="bi bi-quote fs-4"></i>
    <span>{{ frase }}</span>
</div>

<div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
    <h1 class="h4 mb-0">Minhas tarefas</h1>

    <div class="dropdown">
        <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
            <i class="bi bi-funnel"></i> Filtrar: <span id="rotulo-filtro">Todas</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item item-filtro" href="#" data-status="">Todas</a></li>
            <li><a class="dropdown-item item-filtro" href="#" data-status="pendente">Pendente</a></li>
            <li><a class="dropdown-item item-filtro" href="#" data-status="em andamento">Em andamento</a></li>
            <li><a class="dropdown-item item-filtro" href="#" data-status="concluida">Concluída</a></li>
        </ul>
    </div>
</div>

<div id="lista-tarefas" class="row g-3">
    {% include "_lista_tarefas.html" %}
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/filtro_tarefas.js') }}"></script>
{% endblock %}
