{% extends "base.html" %}
{% block title %}{{ titulo_pagina }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow-sm mt-2">
            <div class="card-body p-4">
                <h1 class="h4 mb-4">{{ titulo_pagina }}</h1>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label" for="titulo">Título</label>
                        <input type="text" class="form-control" id="titulo" name="titulo" required
                               value="{{ tarefa['titulo'] if tarefa else '' }}" autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="descricao">Descrição</label>
                        <textarea class="form-control" id="descricao" name="descricao" rows="3">{{ tarefa['descricao'] if tarefa else '' }}</textarea>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="status">Status</label>
                        <select class="form-select" id="status" name="status">
                            {% set status_atual = tarefa['status'] if tarefa else 'pendente' %}
                            <option value="pendente" {{ 'selected' if status_atual == 'pendente' }}>Pendente</option>
                            <option value="em andamento" {{ 'selected' if status_atual == 'em andamento' }}>Em andamento</option>
                            <option value="concluida" {{ 'selected' if status_atual == 'concluida' }}>Concluída</option>
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check2"></i> Salvar
                        </button>
                        <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
